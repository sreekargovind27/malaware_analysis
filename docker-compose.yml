services:
  full_pipeline:
    build: .
    container_name: iot23-full
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./analysis:/app/analysis
      - ./models:/app/models
      - ./scripts:/app/scripts
      - ./config.py:/app/config.py
    environment:
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
      - SPARK_DRIVER_MEMORY=8g
      - SPARK_EXECUTOR_MEMORY=8g
      - DATA_SAMPLE_FRACTION=1.0
    command: python3 run_full_pipeline.py

  stage1_only:
    build: .
    container_name: iot23-stage1
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./analysis:/app/analysis
      - ./config.py:/app/config.py
    environment:
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
      - SPARK_DRIVER_MEMORY=8g
      - SPARK_EXECUTOR_MEMORY=8g
      - DATA_SAMPLE_FRACTION=1.0
    command: python3 analysis/stage1/run_stage1.py

  stage2_only:
    build: .
    container_name: iot23-stage2
    volumes:
      - ./data:/app/data
      - ./outputs:/app/outputs
      - ./analysis:/app/analysis
      - ./models:/app/models
      - ./scripts:/app/scripts
      - ./config.py:/app/config.py
    environment:
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
      - SPARK_DRIVER_MEMORY=8g
      - SPARK_EXECUTOR_MEMORY=8g
      - DATA_SAMPLE_FRACTION=1.0
    command: python3 analysis/stage2/run_stage2.py
